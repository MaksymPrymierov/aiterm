[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/app"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/MaksymPrymierov/aiterm"

[workspace.dependencies]
aiterm-intercept = { path = "crates/intercept" }
aiterm-vt = { path = "crates/vt" }
aiterm-render = { path = "crates/render" }

alacritty_terminal = "0.26"
arboard = { version = "3.7", features = ["wayland-data-control"] }
bitflags = "2"
bytemuck = { version = "1", features = ["derive"] }
env_logger = "0.11"
glyphon = "0.12"
log = "0.4"
polling = "3"
pollster = "0.4"
wgpu = "30"
winit = "0.30.13"
# 5.x: mature line with a blocking API (6.x drops it).
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }

[profile.release]
lto = "thin"
codegen-units = 1
